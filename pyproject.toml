[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka4-ready"
version = "0.1.0"
description = "Find Kafka 3 settings and CLI usage that Kafka 4 rejects or silently ignores: ZooKeeper-mode broker files, removed broker configs, removed CLI options, bootstrap-server format, removed tool classes. Rules are checked against a real Kafka 4 broker. SARIF and GitHub Action."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhammad Arslan", email = "cosmichackerx@users.noreply.github.com" }]
keywords = ["kafka", "kafka4", "kafka-4", "kraft", "zookeeper", "apache-kafka", "migration", "lint", "linter", "sarif", "ci", "github-actions", "deprecation", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/cosmichackerx/kafka4-ready"
Issues = "https://github.com/cosmichackerx/kafka4-ready/issues"

[project.scripts]
kafka4-ready = "kafka4_ready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
