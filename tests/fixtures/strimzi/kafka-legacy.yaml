apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
spec:
  kafka:
    version: 3.9.0
    replicas: 3
    config:
      offsets.topic.replication.factor: 3
      log.message.format.version: "3.5"   # kept from the 3.5 upgrade
      "inter.broker.protocol.version": 3.5
      num.recovery.threads.per.data.dir: 1
      log.cleaner.enable: "false"
      remote.log.manager.copier.thread.pool.size: 0
      min.insync.replicas: 2
    storage:
      type: ephemeral
  zookeeper:
    replicas: 3
    config:
      log.message.format.version: "3.5"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: t
spec:
  config:
    log.message.format.version: "3.5"
